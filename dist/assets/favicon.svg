<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="VideoTask">
  <!-- VideoTask のロゴ案B「進み具合のリング」（videotask-ios の docs/brand/mark-b-*.svg と同じ形）。
       緑の弧が見た分、黄色の弧がまだの分、中央は再生のマーク。
       ブラウザが暗い表示のときは、下地のリングと再生のマークを暗い背景用の色にする。 -->
  <style>
    .base{stroke:#E2F5EC}
    .play{fill:#0E3B2C;stroke:#0E3B2C}
    @media (prefers-color-scheme: dark){
      .base{stroke:#1E3A2F}
      .play{fill:#E8F0EB;stroke:#E8F0EB}
    }
  </style>
  <circle class="base" cx="50" cy="50" r="31" fill="none" stroke-width="12"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#26D483" stroke-width="12" stroke-linecap="round" stroke-dasharray="137 200" transform="rotate(-90 50 50)"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#FFE45C" stroke-width="12" stroke-linecap="round" stroke-dasharray="26 200" stroke-dashoffset="-158" transform="rotate(-90 50 50)"/>
  <path class="play" d="M44 38 L62 50 L44 62 Z" stroke-width="5" stroke-linejoin="round"/>
</svg>
