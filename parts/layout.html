<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://yhasegawa.com{{url}}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yhasegawa.com{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="長谷川侑希｜動画のしくみ {{service}} と、業務アプリの受託開発">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://yhasegawa.com/assets/img/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="VideoTask｜動画を配ったら、まだ見ていない人がすぐ分かる。">
<meta name="twitter:card" content="summary_large_image">
<!-- TODO: 本人の写真が用意できたら、文字だけの ogp.png を差し替える -->

<!-- タブとホーム画面の印。SVG が読めない古いブラウザのために 32px の PNG も置く -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#173F35">
<meta name="theme-color" content="#0F1A17" media="(prefers-color-scheme: dark)">

<!-- 日本語は BIZ UDPGothic。読みやすさのためにつくられた書体で、
     年配の方にも読みやすい。数字だけ Barlow を使う。
     swap を指定しているので、落ちてくるまではシステムの書体で読める。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Barlow:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<!-- メニューの折りたたみは、描画が始まる前に決めないと一瞬ひらいて見える -->
<script>document.documentElement.className+=" js";</script>
</head>
<body data-current="{{current}}">

<a class="skip" href="#main">本文へ移動する</a>

{{header}}

<main id="main">
{{body}}

{{tail}}
</main>

{{footer}}

{{mobilebar}}

<script src="/assets/js/site.js" defer></script>
<!-- Cloudflare Web Analytics。Cookie を使わないので同意バナーは不要 -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "6b4eab9c76094eebb6e545de0c437730"}'></script>
</body>
</html>
