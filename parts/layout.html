<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://yhasegawa.com{{url}}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yhasegawa.com{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="長谷川侑希｜動画のしくみ {{service}} と、業務アプリの受託開発">
<meta property="og:locale" content="ja_JP">
<!-- TODO: OGP画像（1200x630）を用意して og:image を足す。長谷川本人が現場にいる写真 -->
<meta name="theme-color" content="#173F35">
<meta name="theme-color" content="#0F1A17" media="(prefers-color-scheme: dark)">

<!-- 日本語は BIZ UDPGothic。読みやすさのためにつくられた書体で、
     年配の方にも読みやすい。数字だけ Barlow を使う。
     swap を指定しているので、落ちてくるまではシステムの書体で読める。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Barlow:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<!-- メニューの折りたたみは、描画が始まる前に決めないと一瞬ひらいて見える -->
<script>document.documentElement.className+=" js";</script>
</head>
<body data-current="{{current}}">

<a class="skip" href="#main">本文へ移動する</a>

{{header}}

<main id="main">
{{body}}

{{tail}}
</main>

{{footer}}

{{mobilebar}}

<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"

</body>
</html>
