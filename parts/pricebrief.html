<!-- 各ページに置く費用の要約。
     税理士などのパートナーが業種別ページのURLを直接送る想定なので、
     トップを経由しなくても「いくらで、どう相談するか」が分かるようにする。
     金額を変えるときは、ここと pages/index.html と /ryokin/ の3箇所。 -->
<section class="section">
  <div class="wrap">
    <div class="sec-head">
      <h2>進め方と費用</h2>
      <p>最初の一歩は無料です。お金がかかるのは、動くものを試していただくときからです。</p>
    </div>

    <div class="price-brief">
      <ol>
        <li>
          <span class="s">まず、ご相談と現場の見学</span>
          <span class="p free">無料</span>
        </li>
        <li>
          <span class="s">次に、お試し版（プロトタイプ）</span>
          <span class="p">約30万円</span>
          <span class="k">合格条件を満たさなければ、いただきません</span>
        </li>
        <li>
          <span class="s">そのあと、本開発と運用</span>
          <span class="p">初期 約100〜200万円</span>
          <span class="k">月額 約5万円</span>
        </li>
      </ol>
      <p class="k">
        金額は税別の目安です。本開発には補助金を使える場合がありますが、
        多くの制度では交付が決まる前に契約したものは対象外です。
        お使いになりたい場合は、契約の前にご相談ください。
      </p>
      <div class="btn-row">
        <a class="btn ghost" href="/ryokin/">進め方と費用をくわしく見る</a>
        <a class="btn ghost" href="/hojokin/">補助金のご案内</a>
      </div>
    </div>
  </div>
</section>
