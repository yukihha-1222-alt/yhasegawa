# Cloudflare Workers の設定
#
# これを置くと、いままでダッシュボードだけで決まっていた配信の設定を、
# このファイルが上書きします。入れ替えは慎重に。
#
# 【確認してください】name は、いまダッシュボードにある Worker の名前と
# 同じでなければいけません。違う名前にすると、別の Worker が新しく作られ、
# yhasegawa.com はいまのまま（古いサイト）になります。
# Compute (Workers) の一覧に出ている名前をそのまま書いてください。
name = "yhasegawa"

main = "worker/index.js"
compatibility_date = "2026-11-10"

# ------------------------------------------------------------------
# 配信するのは dist/ の中だけ。
# pages/ parts/ vendor/ build.py check.py *.md は入らないので、
# URL を打っても 404 になります。
# ------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"

# 知らないURLのときに dist/404.html を返す
not_found_handling = "404-page"

# /api/ だけ先に worker/index.js へ。それ以外は静的ファイルが直接返る
# （静的ファイルの配信は Workers のリクエスト数に数えられない）
# すべてコードを先に通す。理由は2つ。
#   ・/api/form を受ける
#   ・古いURL（/shikumi/ など）を新しいURLへ転送する
#   ・本番以外のドメイン（プレビューの *.workers.dev）で
#     X-Robots-Tag: noindex を付ける
# 静的ファイルはコードから env.ASSETS.fetch() で返すので中身は同じ。
# Workers の無料枠は1日10万リクエストで、いまの閲覧数とは桁が違う。
run_worker_first = true

# ------------------------------------------------------------------
# フォームの送信先。
# Email Routing で Verified になっているアドレスしか指定できない。
# 届く場所は、いま hasegawa@yhasegawa.com を転送している先と同じ。
# ------------------------------------------------------------------
[[send_email]]
name = "MAIL"
destination_address = "sakamotoyuki.develop@gmail.com"

# ------------------------------------------------------------------
# 先行モニターの申し込み（worker/monitor.js）。運営者あてのメール。
# MAIL と同じ Email Routing のしくみ（無料）。Verified のアドレスにだけ送れるので、
# 前もって Email Routing の宛先（Destination addresses）に
# support@videotask.app を足し、届いた確認のメールのリンクを押しておくこと。
# 申込者には、メールを自動で送らない（2026-11-18 の決め）。
# ------------------------------------------------------------------
[[send_email]]
name = "SUPPORT"
destination_address = "support@videotask.app"

# 先行モニターの申し込みの記録（同意の記録）。表は worker/schema.sql
# 本番とプレビューで分ける。どちらを使うかは、worker/index.js がドメインで決める
# （yhasegawa.com なら DB、それ以外なら DB_PREVIEW）。
# 【作ったら直す】database_id は `npx wrangler d1 create <名前>` で出た値
[[d1_databases]]
binding = "DB"
database_name = "yhasegawa-form"
database_id = "3c9fe6a0-fe86-4b79-b125-9200b9aca6ea"

[[d1_databases]]
binding = "DB_PREVIEW"
database_name = "yhasegawa-form-preview"
database_id = "41f44010-83a9-42b2-a59f-97128cdf0016"

[vars]
# 画面に出る鍵。公開してよい
TURNSTILE_SITEKEY = "0x4AAAAAAF6EyfFEgIfvcIj9"
# メールの宛先。send_email の destination_address と同じにする
MAIL_TO = "sakamotoyuki.develop@gmail.com"

# TURNSTILE_SECRET はここに書かない。
# ダッシュボードの Settings → Variables and Secrets から Secret として入れる。
